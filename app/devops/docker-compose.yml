version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: app/devops/Dockerfile
    ports:
      - '5000:5000'
    volumes:
      - ../../storage:/app/storage
      - ../../.env:/app/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/whispa
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=whispa
    ports:
      - '5433:5432'
    restart: unless-stopped

volumes:
  postgres_data:
